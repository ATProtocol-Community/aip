name: Build & publish AIP image (CIC)
on:
  push:
    branches:
      - CIC
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short=12 "${{ github.sha }}")
          TAGS="ghcr.io/atprotocol-community/aip:${GITHUB_REF_NAME}-${SHA_SHORT}"
          TAGS="${TAGS},ghcr.io/atprotocol-community/aip:${GITHUB_REF_NAME}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${TAGS},ghcr.io/atprotocol-community/aip:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            FEATURES=embed,postgres
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR packages default to private even on public repos. The VM pulls
      # anonymously (no registry creds), so flip visibility to public using
      # the workflow token (packages:write on this repo).
      - name: Make container package public
        if: always()
        run: |
          for url in \
            https://api.github.com/orgs/ATProtocol-Community/packages/container/aip/visibility \
            https://api.github.com/user/packages/container/aip/visibility; do
            resp=$(curl -fsS -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "$url" \
              -d '{"visibility": "public"}' 2>&1) && { echo "public via $url"; break; } \
              || echo "visibility attempt failed on $url: $resp"
          done || true