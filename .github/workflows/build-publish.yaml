name: Build & publish AIP image (CIC)
on:
  push:
    branches:
      - CIC
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short=12 "${{ github.sha }}")
          TAGS="ghcr.io/atprotocol-community/aip:${GITHUB_REF_NAME}-${SHA_SHORT}"
          TAGS="${TAGS},ghcr.io/atprotocol-community/aip:${GITHUB_REF_NAME}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${TAGS},ghcr.io/atprotocol-community/aip:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            FEATURES=embed,postgres
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR packages default to private even on public repos. The VM pulls
      # anonymously (no registry creds), so flip visibility to public using
      # the workflow token (packages:write on this repo).
      - name: Make container package public
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          PKG_NAME=aip
          rpkgs=$(gh api '/repos/ATProtocol-Community/aip/packages?package_type=container' 2>&1)
          echo "repo packages: $rpkgs"
          JSON_NAME=$(gh api '/repos/ATProtocol-Community/aip/packages?package_type=container' --jq '.[0].name // empty' 2>/dev/null)
          [ -n "$JSON_NAME" ] && PKG_NAME="$JSON_NAME"
          echo "PKG_NAME=$PKG_NAME"
          for route in "/orgs/ATProtocol-Community/packages/container/$PKG_NAME/visibility" "/user/packages/container/$PKG_NAME/visibility"; do
            echo "-- route: $route"
            gh api -X POST -H "Accept: application/vnd.github+json" "$route" -f visibility=public 2>&1 | head -20
          done
          echo "::warning::If neither route worked, set visibility manually at https://github.com/orgs/ATProtocol-Community/packages"